<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
</head>
<style>
    * {
        padding: 0;
        margin: 0;

    }

    .mygame {

        display: flex;
        margin-top: 100px;
        justify-content: center;
        gap: 400px;
    }

    ul {
        list-style: none;
    }

    nav {
        height: 60px;
        font-size: 30px;
        background-color: rgb(40, 12, 66);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .contentbox {
        display: grid;
        grid-template-rows: repeat(3, 10vw);
        grid-template-columns: repeat(3, 10vw);

    }

    h1 {
        color: seagreen;
    }


    .box {
        border: 2px solid seagreen;
    }

    .box:hover {
        background-color: pink;
    }

    .boxtext {
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 100px;
    }

    .bt-0 {
        border-top: 0;
    }

    .bb-0 {
        border-bottom: 0;
    }

    .br-0 {
        border-right: 0;
    }

    .bl-0 {
        border-left: 0;
    }

    .gameinfo {

        line-height: 160px;

    }

    .btn {
        display: flex;
        gap: 25px;
        justify-content: center;
    }

    button {
        display: inline;
        padding: 10px;
        background-color: seagreen;
        color: white;
        border-radius: 20px;
        cursor: pointer;
    }

    .info {
        text-align: center;
    }

    .infotrn {
        color: green;
        font-size: 30px;
        word-spacing: 10px;
    }

    .imgbox img {
        position: relative;
        right: 300px;
        bottom: 250px;
        width: 0;
        transition: width 1s ease-in-out;
    }

    .draw {
        font-size: 50px;
        background-color: red;
        position: absolute;
        top: 300px;
        left: 500px;
        visibility: hidden;

    }

    span {
        color: red;
    }
</style>

<body>
    <nav>
        <ul>
            <li> My Tic Tac Toe Game</li>
        </ul>
    </nav>
    <div class="mygame">
        <div class="gamecontent">
            <div class="contentbox">
                <div class="box bt-0 bl-0 "><span class="boxtext "></span></div>
                <div class="box bt-0"><span class="boxtext"></span></div>
                <div class="box bt-0 br-0"><span class="boxtext"></span></div>
                <div class="box bl-0"><span class="boxtext"></span></div>
                <div class="box "><span class="boxtext"></span></div>
                <div class="box br-0"><span class="boxtext"></span></div>
                <div class="box bb-0 bl-0"><span class="boxtext"></span></div>
                <div class="box bb-0 "><span class="boxtext"></span></div>
                <div class="box bb-0 br-0"><span class="boxtext"></span></div>
            </div>
            <div class="draw">MATCH DRAW</div>
        </div>
        <div class="gameinfo">
            <h1>Welcome To Tic-Tac-Toe</h1>
            <div class="btn"><button id="reset">RESET</button>
                <button id="stopmusic">Stop Music</button>
                <button id="startmusic">Start Music</button>
            </div>
            <div class="info">
                <h2 class="infotrn">Turn for <span>X</span> </h2>
            </div>

            <div class="imgbox">
                <img src="mickky.gif" alt="mickky">
            </div>


            <script>
                console.log("Welcome To Tic-Tac-Toe");
                let music = new Audio("music.mp3");
                let audioTurn = new Audio("turn1.wav");
                let gameover = new Audio("gameover.mp3");
                let turn = "X";
                let isgameover = false;
                count = 0;
                //function to change turn
                const changeTurn = () => {
                    return turn === "X" ? "O" : "X";
                }



                //function to check win
                const checkWin = () => {
                    let boxtext = document.getElementsByClassName("boxtext");
                    let wins = [
                        [0, 1, 2],
                        [3, 4, 5],
                        [6, 7, 8],
                        [0, 3, 6],
                        [1, 4, 7],
                        [2, 5, 8],
                        [0, 4, 8],
                        [2, 4, 6]
                    ]
                    wins.forEach(e => {
                        if ((boxtext[e[0]].innerText === boxtext[e[1]].innerText) && (boxtext[e[2]].innerText === boxtext[e[1]].innerText) && (boxtext[e[1]].innerText !== '')) {
                            document.querySelector('.infotrn').innerText = boxtext[e[0]].innerText + "   won";
                            gameover.play();
                            isgameover = true;
                            document.querySelector('.imgbox').getElementsByTagName('img')[0].style.width = "200px";
                        }

                    })
                }

                // music.play();
                //game logic
                let boxes = document.getElementsByClassName("box");
                Array.from(boxes).forEach(element => {
                    let boxtexts = element.querySelector('.boxtext');
                    element.addEventListener('click', () => {
                        if (boxtexts.innerText === '') {
                            boxtexts.innerText = turn;
                            turn = changeTurn();
                            audioTurn.play();
                            checkWin();
                            if (!isgameover) {
                                document.getElementsByClassName("infotrn")[0].innerText = "Turn for " + turn;
                                
                            }
                            count++;
                            console.log(count);
                            if (count == 9 && isgameover==false) {
                                document.querySelector('.infotrn').innerText= "MATCH DRAW";
                                document.querySelector('.infotrn').style.color= "red";
                                document.querySelector('.infotrn').style.fontSize= "50px";
                                
                             
                            }

                        }

                    })
                })
                //for rest button
                reset.addEventListener('click', () => {
                    let boxtexts = document.querySelectorAll('.boxtext');
                    Array.from(boxtexts).forEach(element => {
                        element.innerText = "";
                    });
                    turn = "X";
                    isgameover = false;
                    document.getElementsByClassName("infotrn")[0].innerText = "Turn for" + turn;
                    document.querySelector('.imgbox').getElementsByTagName('img')[0].style.width = "0";
                    document.querySelector('.infotrn').style.color= "green";
                })
                //stop music
                stopmusic.addEventListener('click', () => {
                    music.pause();
                })
                //start music
                startmusic.addEventListener('click', () => {
                    music.play();
                })
            </script>
</body>

</html>
